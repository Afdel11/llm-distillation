data:
  tokenizer_name: "Qwen/Qwen2.5-0.5B-Instruct"
  examples_path: "outputs/data_10k/train.json"
  val_examples_path: "outputs/data_10k/val.json"
  max_length: 256
  batch_size: 2
  gradient_accumulation_steps: 2

models:
  teacher_names:
    large: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
    small: "Qwen/Qwen2.5-0.5B-Instruct"
  student:
    hidden_size: 512
    num_hidden_layers: 4
    num_attention_heads: 8
    num_key_value_heads: 4
    intermediate_size: 2048

training:
  regime: arcd_topk_diverse
  device: cuda
  epochs: 20
  early_stopping_patience: 3
  lr: 0.0005
  temperature: 2.0
  consensus_top_k: 10
  seed: 0

output:
  checkpoint_dir: outputs/checkpoints
  # Teacher large différent (Coder) -> cache dédié, dataset 9000 exemples
  # (SÉPARÉ du cache diversifié 900 exemples utilisé par arcd_diverse).
  teacher_cache_path: outputs/teacher_cache_diverse_10k.pt
  teacher_cache_val_path: outputs/teacher_cache_val_diverse_10k.pt
