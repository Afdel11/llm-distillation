# Combine les deux interventions : enseignant diversifié (Coder) ET
# consensus_top_k. C'est LE test décisif : si l'adaptivité de lambda(x)
# doit un jour montrer un vrai effet, c'est dans cette configuration
# (désaccord réel entre Teachers + mécanisme de détection non dilué)
# qu'il devrait apparaître le plus nettement.

data:
  tokenizer_name: "Qwen/Qwen2.5-0.5B-Instruct"
  examples_path: "outputs/data/train.json"
  val_examples_path: "outputs/data/val.json"
  max_length: 256
  batch_size: 2
  gradient_accumulation_steps: 2

models:
  teacher_names:
    large: "Qwen/Qwen2.5-Coder-1.5B-Instruct"   # <- Teacher diversifié
    small: "Qwen/Qwen2.5-0.5B-Instruct"
  student:                    # IDENTIQUE aux autres configs arcd (comparaison équitable)
    hidden_size: 512
    num_hidden_layers: 4
    num_attention_heads: 8
    num_key_value_heads: 4
    intermediate_size: 2048

training:
  regime: arcd_topk_diverse
  device: cuda
  epochs: 20
  early_stopping_patience: 3
  lr: 0.0005
  temperature: 2.0
  consensus_top_k: 10
  seed: 0

output:
  checkpoint_dir: outputs/checkpoints
  teacher_cache_path: outputs/teacher_cache_diverse.pt         # PARTAGÉ avec arcd_diverse.yaml
  teacher_cache_val_path: outputs/teacher_cache_val_diverse.pt # PARTAGÉ avec arcd_diverse.yaml
