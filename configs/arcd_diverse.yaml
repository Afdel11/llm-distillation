# Variante "diversité forcée" d'ARCD : remplace le Teacher large généraliste
# (Qwen2.5-1.5B-Instruct) par un Teacher spécialisé code de la même famille
# (Qwen2.5-Coder-1.5B-Instruct), MÊME tokenizer vérifié (voir
# scripts/check_tokenizer_compatibility.py), pour introduire un vrai
# désaccord entre Teachers sur les données générales (French-Alpaca) et
# ainsi mesurer si C varie réellement -- dans le régime "arcd" standard,
# C ≈ 1,000 en permanence, ce qui signifie que la robustesse au désaccord
# n'a jamais été mise à l'épreuve.
#
# Utilise le même ARCDTrainer que le régime "arcd" (voir scripts/train.py,
# regime in ("arcd", "arcd_diverse")). Cache et checkpoints SÉPARÉS de ceux
# du régime "arcd" standard -> aucun risque d'écraser les runs existants.

data:
  tokenizer_name: "Qwen/Qwen2.5-0.5B-Instruct"
  examples_path: "outputs/data/train.json"
  val_examples_path: "outputs/data/val.json"
  max_length: 256
  batch_size: 2
  gradient_accumulation_steps: 2

models:
  teacher_names:
    large: "Qwen/Qwen2.5-Coder-1.5B-Instruct"   # <- seul changement vs arcd.yaml
    small: "Qwen/Qwen2.5-0.5B-Instruct"
  student:                    # IDENTIQUE à celui d'arcd.yaml (comparaison équitable)
    hidden_size: 512
    num_hidden_layers: 4
    num_attention_heads: 8
    num_key_value_heads: 4
    intermediate_size: 2048

training:
  regime: arcd_diverse
  device: cuda
  epochs: 20
  early_stopping_patience: 3
  lr: 0.0005
  temperature: 2.0
  seed: 0
  # Voir configs/arcd.yaml — MÊME valeur ici pour que le "C" loggué reste
  # comparable entre arcd et arcd_diverse (la diversité des Teachers est la
  # seule variable qui doit changer entre les deux régimes).
  consensus_top_k: 50

output:
  checkpoint_dir: outputs/checkpoints
  teacher_cache_path: outputs/teacher_cache_diverse.pt         # SÉPARÉ du cache arcd standard
  teacher_cache_val_path: outputs/teacher_cache_val_diverse.pt # idem
