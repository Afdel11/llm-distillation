data:
  tokenizer_name: "Qwen/Qwen2.5-0.5B-Instruct"
  examples_path: "outputs/data/train.json"
  val_examples_path: "outputs/data/val.json"
  max_length: 256
  batch_size: 2
  gradient_accumulation_steps: 2

models:
  teacher_names:
    large: "Qwen/Qwen2.5-1.5B-Instruct"
  student:
    hidden_size: 512
    num_hidden_layers: 4
    num_attention_heads: 8
    num_key_value_heads: 4
    intermediate_size: 2048

training:
  regime: hinton_kd
  device: cuda
  epochs: 15
  early_stopping_patience: 4
  lr: 0.00005
  temperature: 2.0
  hinton_alpha: 0.5
  seed: 0

output:
  checkpoint_dir: outputs/checkpoints_pretrained
  teacher_cache_path: outputs/teacher_cache_hinton_pretrained.pt
  teacher_cache_val_path: outputs/teacher_cache_val_hinton_pretrained.pt
