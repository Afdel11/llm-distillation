# ARCD avec un Teacher DÉSORMAIS compétent sur le DIT (le Qwen0.5B qu'on
# vient de fine-tuner), couplé au Teacher 1.5B générique inchangé. Teste
# si la distillation a enfin quelque chose de réellement spécifique à
# transmettre, plutôt que de la connaissance générale diluée.

data:
  tokenizer_name: "Qwen/Qwen2.5-0.5B-Instruct"
  examples_path: "outputs/data_dit/dit_train.json"
  val_examples_path: "outputs/data_dit/dit_val.json"
  max_length: 256
  batch_size: 2
  gradient_accumulation_steps: 2

models:
  teacher_names:
    large: "Qwen/Qwen2.5-1.5B-Instruct"                                    # générique, inchangé
    small: "outputs/checkpoints_dit_qwen05b/student_alone_seed0_final"     # <- notre Teacher fine-tuné DIT
  student:
    hidden_size: 512
    num_hidden_layers: 4
    num_attention_heads: 8
    num_key_value_heads: 4
    intermediate_size: 2048

training:
  regime: arcd_topk
  device: cuda
  epochs: 40
  early_stopping_patience: 8
  lr: 0.0001
  temperature: 2.0
  consensus_top_k: 10
  seed: 0

output:
  checkpoint_dir: outputs/checkpoints_dit_smart
  teacher_cache_path: outputs/__no_cache_dit_smart__.pt
  teacher_cache_val_path: outputs/__no_cache_dit_smart_val__.pt
