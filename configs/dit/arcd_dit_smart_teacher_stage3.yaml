data:
  tokenizer_name: "Qwen/Qwen2.5-0.5B-Instruct"
  examples_path: "outputs/data_dit/dit_train.json"
  val_examples_path: "outputs/data_dit/dit_val.json"
  max_length: 256
  batch_size: 2
  gradient_accumulation_steps: 2

models:
  teacher_names:
    large: "Qwen/Qwen2.5-1.5B-Instruct"
    # IMPORTANT : pointe vers le Teacher étape 3 (pas encore entraîné à ce
    # stade -- lance d'abord qwen05b_dit_stage3.yaml, PUIS ce fichier)
    small: "outputs/checkpoints_dit_qwen05b_stage3/student_alone_seed0_final"
  student:
    hidden_size: 512
    num_hidden_layers: 4
    num_attention_heads: 8
    num_key_value_heads: 4
    intermediate_size: 2048

training:
  regime: arcd_topk
  device: cuda
  epochs: 15
  early_stopping_patience: 4
  lr: 0.00005          # réduit -- étape 3, affiner sans écraser
  temperature: 2.0
  consensus_top_k: 10
  seed: 0

output:
  checkpoint_dir: outputs/checkpoints_dit_smart_stage3
  teacher_cache_path: outputs/__no_cache_dit_smart_s3__.pt
  teacher_cache_val_path: outputs/__no_cache_dit_smart_s3_val__.pt
