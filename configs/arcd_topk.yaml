# ARCD avec consensus_top_k : corrige la dilution du signal de désaccord
# identifiée empiriquement (chapitre 5 du mémoire + scripts/diagnose_consensus.py).
# Réutilise le MÊME cache Teacher que arcd.yaml standard (mêmes 2 Teachers,
# mêmes logits) -- seul le calcul de C change (top_k au lieu de vocabulaire
# complet), pas les Teachers eux-mêmes ni P* (cible de L_KD, inchangée).
#
# top_k=10 choisi comme point de départ : d'après le diagnostic, un bon
# compromis entre sensibilité au désaccord (C moyen ~0.98, vs ~1.0 dilué)
# et stabilité (pas basé sur un seul token, contrairement à top_k=1 qui
# est le plus sensible mais aussi le plus bruité).

data:
  tokenizer_name: "Qwen/Qwen2.5-0.5B-Instruct"
  examples_path: "outputs/data/train.json"
  val_examples_path: "outputs/data/val.json"
  max_length: 256
  batch_size: 2
  gradient_accumulation_steps: 2

models:
  teacher_names:
    large: "Qwen/Qwen2.5-1.5B-Instruct"
    small: "Qwen/Qwen2.5-0.5B-Instruct"
  student:                    # IDENTIQUE à arcd.yaml (comparaison équitable)
    hidden_size: 512
    num_hidden_layers: 4
    num_attention_heads: 8
    num_key_value_heads: 4
    intermediate_size: 2048

training:
  regime: arcd_topk
  device: cuda
  epochs: 20
  early_stopping_patience: 3
  lr: 0.0005
  temperature: 2.0
  consensus_top_k: 10          # <- seul changement vs arcd.yaml
  seed: 0

output:
  checkpoint_dir: outputs/checkpoints
  teacher_cache_path: outputs/teacher_cache.pt         # PARTAGÉ avec arcd.yaml (mêmes Teachers)
  teacher_cache_val_path: outputs/teacher_cache_val.pt # PARTAGÉ avec arcd.yaml
